# Syncs commits to the the Codeberg mirror
name: Sync to Codeberg

on:
  push:
    branches:
        - "main"
  workflow_dispatch:

permissions:
  contents: read

jobs:
    sync-to-codeberg:
      if: ${{ github.repository == vars.REPOSITORY }}
      runs-on: ubuntu-latest
      steps:
      - name: Checking out branch
        uses: actions/checkout@v7
        with:
            fetch-depth: 0
      - name: Push to Codeberg
        env:
          CODEBERG_TOKEN: ${{ secrets.CODEBERG_TOKEN }}
          CODEBERG_USERNAME: ${{ vars.CODEBERG_USERNAME }}
        run: |
          git remote add codeberg https://${CODEBERG_USERNAME}:${CODEBERG_TOKEN}@codeberg.org/Arcticons/Arcticons-Android.git
          git push codeberg --tags --force --prune 'refs/heads/*:refs/heads/*'
